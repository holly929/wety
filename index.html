    <title>expo-app</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        margin: 0; /* Added to remove default margins */
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        flex-direction: column; /* To stack elements vertically */
        align-items: center; /* Center content horizontally */
        justify-content: flex-start; /* Align items at the top */
        padding: 20px; /* Optional padding */
      }
      /* Optional: style for the logo image */
      #logo {
        max-width: 150px; /* Adjust size as needed */
        height: auto;
        margin-bottom: 20px; /* Space below the logo */
      }
    </style>
  </head>

      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <!-- Logo Image -->
      <img src="images/logo.png" alt="ID Card Logo" id="logo" />
      
      <!-- ID Card Content -->
      <div id="id-card-content">
        <!-- Your ID card printing code or content goes here -->

    </div>
